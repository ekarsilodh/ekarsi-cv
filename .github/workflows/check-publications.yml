# Checks ORCID once a week for publications that are not on the website yet.
# If it finds any, it opens a pull request with them added in the site's style.
# Nothing changes on the live site until you review and merge that pull request.

name: Check for new publications

on:
  schedule:
    - cron: "17 6 * * 1"     # every Monday at 06:17 UTC (07:17 in summer UK time)
  workflow_dispatch:          # lets you run it any time from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-publications
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compare ORCID with the website
        id: check
        run: |
          python scripts/check_publications.py \
            --html index.html \
            --orcid 0009-0000-7462-3217 \
            --pr-body "$RUNNER_TEMP/pr_body.md"

      - name: Open a pull request for review
        if: steps.check.outputs.new_count != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/new-publications
          delete-branch: true
          add-paths: index.html
          commit-message: "Add new publications from ORCID"
          title: "New publications found on ORCID"
          body-path: ${{ runner.temp }}/pr_body.md
